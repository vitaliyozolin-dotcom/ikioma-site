schema_version: 1
project:
  name: "ИКИОМА — сайт проекта ВЕЛА"
  owner: "Виталий Озолин"
  status: review
  updated_at: "2026-11-15"
goal: "Один дом ВЕЛА, проверяемая комплектация, рабочие калькуляторы и заявки в воронке ИКИОМА ОС."
sources:
  product: "Мастер-промпт 3.0 ВЕЛА"
  plan: "IKIOMA_VELA_plan(1).pdf"
  catalog: "public/vela/catalog.json"
  domain: "https://ikioma.ru/"
  source_repository: "vitaliyozolin-dotcom/ikioma-site"
  crm_repository: "vitaliyozolin-dotcom/stroi_os"
stages:
  - id: plan
    status: completed
    evidence: "Векторный план перенесён из PDF, тёмные контуры при наложении совпадают в допуске 2 px при масштабе 2×."
  - id: product
    status: in_review
    evidence: "Галерея ВЕЛА с готовыми фотореалистичными визуализациями отделки, фотографии Келози, калькуляторы и интерактивная планировка. Проверки архитектуры сайта в docs/releases/2026-11-14-vela-visuals.md."
    visual_sources:
      facade: "Современный дом с тёплой верандой.png"
      terrace: "Скандинавский дом в золотом свете(1).png"
      living_room: "Уютная кухня-гостиная с лесной панорамой.png"
    pending: "Утверждённые фасады и разрез ВЕЛА, спецификация домокомплекта, условия гарантии и подарка."
  - id: crm
    status: in_review
    evidence: "Используются существующая воронка и версия 2 приёмника из PR stroi_os #86. Боевые readiness и CORS отвечают."
    pending: "Выпуск приёмника и сквозная проверка на боевом домене."
  - id: legal
    status: in_review
    evidence: "Политика, отдельное согласие, реквизиты и условия расчёта подготовлены. Реквизиты совпали с опубликованными на сайте компании."
    pending: "Подтверждение фактической модели обработки данных и сверка ЕГРЮЛ."
  - id: launch
    status: blocked
    depends_on: [product, crm, legal]
    evidence: "На ikioma.ru работает сборка от 1 ноября. Timeweb и ветка main остаются каналом публичного выпуска."
constraints:
  - "Площадь застройки 115 м². Площадь помещений 81,7 м². Терраса 22,2 м². Три спальни и один санузел."
  - "Публичная стартовая цена относится к домокомплекту и составляет 1 725 000 ₽."
  - "Цены инженерии и отделки, условия акции и гарантии публикуются по подтверждённым документам."
decision_history:
  - date: "2026-07-29"
    decision: "взять логику ШЕСУА как референс, но сохранить характер ИКИОМА"
  - date: "2026-08-05"
    decision: "перенести сайт в Timeweb и использовать ikioma.ru"
  - date: "2026-08-05"
    decision: "GitHub становится главным источником, автодеплой обязателен"
  - date: "2026-08-05"
    decision: "Продукт временно назывался АРО 120: 96 м² дома и 24 м² террасы"
  - date: "2026-08-05"
    decision: "Все коммерческие CTA ведут в единую форму заявки СтройкаОС"
  - date: "2026-08-05"
    decision: "Цены 5,2 / 6,3 / 7,2 млн ₽ используются как предварительные ориентиры до подтверждения"
  - date: "2026-08-10"
    decision: "Владелец утвердил постоянное название модели КОНТУР"
  - date: "2026-08-10"
    decision: "На сайте используются фактические данные проекта: 86,2 м² внутри и 23,1 м² терраса"
  - date: "2026-08-10"
    decision: "Планировка и ППР Коробицино показаны как документы конкретного проекта, а не универсальное обещание"
  - date: "2026-08-10"
    decision: "Все не документальные изображения маркируются как визуализации до появления реальной фотогалереи"
  - date: "2026-08-10"
    decision: "До следующей итерации с реальными фотографиями опубликованы три временные AI-визуализации семейной жизни"
  - date: "2026-08-10"
    decision: "Интеграция со СтройкаОС не принята: тестовый запрос вернул 502, подтверждённой записи нет"
  - date: "2026-11-13"
    decision: "Один публичный продукт ВЕЛА, утверждённый PDF и новая коммерческая модель по Мастер-промпту 3.0."
  - date: "2026-11-15"
    decision: "Для обложки и галереи ВЕЛА использовать готовые фотореалистичные визуализации из библиотеки."
current_step:
  action: "Сверить галерею с фасадами и разрезом ВЕЛА, подтвердить спецификацию и документы. Выпускать сайт после приёмника заявок."
  owner: "Виталий Озолин и технический исполнитель"
  next_transition: "Разрешённый выпуск на Timeweb с подтверждённой записью TEST в боевой воронке."
