schema_version: 1
project:
  name: "ИКИОМА — официальный сайт"
  area: "маркетинг, продажи и цифровая инфраструктура ИЖС"
  owner: "Виталий Озолин"
  status: review
  updated_at: "2026-08-10"

problem: >-
  Сайт работает на ikioma.ru, но недостаточно подробно показывает сам продукт:
  продуктовый слой уже раскрывает планировку, террасу, участок и семейные сценарии,
  но профессиональной фотогалереи построенных объектов ещё нет, а публичный
  приёмник заявок СтройкаОС недоступен и возвращает 502.

goal: >-
  Представить один дом как полностью раскрытый продукт: рабочее имя КОНТУР,
  точные площади из проекта, актуальная планировка, терраса, участок, комплектации,
  ППР и семейные сценарии; все коммерческие действия завершить заявкой в СтройкаОС.

measurable_result:
  - "https://ikioma.ru открывает актуальную версию сайта по HTTPS"
  - "каждый подтверждённый коммит в main автоматически публикуется в Timeweb"
  - "мобильная и десктопная версии проходят проверку ключевых сценариев"
  - "планировка и ППР на сайте совпадают с исходными проектными документами"

completion_criteria:
  - "репозиторий vitaliyozolin-dotcom/ikioma-site содержит актуальный исходный код"
  - "сборка npm run build:timeweb завершается успешно"
  - "Timeweb подключён к ветке main и автодеплой включён"
  - "домен ikioma.ru привязан к приложению, DNS валиден, SSL активен"
  - "навигация, варианты дома, этапы, FAQ и калькулятор работают"
  - "форма или канал получения заявки подключён и проверен тестовой заявкой"

current_state:
  as_of: "2026-08-10"
  facts:
    - "рабочий адрес: https://ikioma.ru"
    - "GitHub main автоматически публикуется в Timeweb"
    - "название модели КОНТУР подтверждено владельцем 10.08.2026"
    - "96 м² — внешний контур дома, 86,2 м² — полезная площадь помещений"
    - "терраса по проекту: 23,1 м²; маркетинговое округление: 24 м²"
    - "планировка: три спальни, два санузла, кухня-гостиная 27,3 м²"
    - "ППР проекта Коробицино содержит работы с 10.08 по 10.09.2026"
    - "предварительные ориентиры комплектаций: 5,2 / 6,3 / 7,2 млн ₽"
    - "цена участка не входит в стоимость дома"
    - "профессиональные фотографии построенных домов не переданы"
    - "до следующей фотоитерации используются три временные AI-визуализации: фасад с семьёй, кухня-гостиная и крытая терраса"
    - "тестовый POST на https://stroios.online/api/public/leads 10.08.2026 вернул 502 Connection refused; запись в СтройкаОС не создана"
  sources:
    - "ChatGPT Sites project ikioma-homes"
    - "GitHub vitaliyozolin-dotcom/ikioma-site"
    - "технический альбом АРО-96 (Коробицино), редакция 29.03.2026"
    - "ППР.xlsx, редакция 10.08.2026"

stages:
  - id: source
    name: "Единый исходник"
    status: completed
    output: "актуальный код в GitHub и успешная сборка"
    depends_on: []
  - id: hosting
    name: "Timeweb App Platform"
    status: completed
    output: "приложение связано с main, первый деплой успешен"
    depends_on: [source]
  - id: domain
    name: "Домен и HTTPS"
    status: completed
    output: "ikioma.ru отвечает по HTTPS"
    depends_on: [hosting]
  - id: qa
    name: "Приёмка обновлённого сайта"
    status: in_progress
    output: "проверены десктоп, адаптивные правила, планировка, Гант, карточка дома, форма и CTA"
    depends_on: [domain]
  - id: product_content
    name: "Материалы о продукте"
    status: in_progress
    output: "имя КОНТУР утверждено; временные визуализации опубликованы; реальные профессиональные фотографии ожидаются"
    depends_on: [qa]
  - id: leads
    name: "Заявки в СтройкаОС"
    status: blocked
    output: "публичная форма записывает заявку в закрытый контур СтройкаОС"
    depends_on: [qa]

roles:
  owner:
    person: "Виталий Озолин"
    authority: "решения по бренду, домену, хостингу и каналу заявок"
  technical_executor:
    person: "Codex"
    authority: "код, сборка, проверка и подготовка автоматического деплоя"

constraints:
  - "хостинг должен находиться в российском контуре Timeweb"
  - "обновления не должны требовать ручной загрузки файлов"
  - "доступы, пароли и токены не хранятся в репозитории или переписке"
  - "до подключения CRM сайт не должен имитировать отправку заявки"
  - "рендеры и визуализации нельзя подписывать как фотографии построенных объектов"
  - "публичную версию ikioma.ru не обновлять до подтверждения рабочего имени КОНТУР"

metrics:
  result: "доступность ikioma.ru и получение тестовой заявки"
  quality: "0 критических ошибок в ключевых сценариях"
  time: "один автоматический деплой после коммита в main"
  money: "стоимость Timeweb и домена в пределах утверждённого тарифа"
  risk: "отсутствие ручных секретов и незащищённых форм"

risks:
  - id: timeweb_access
    description: "подключение GitHub и домена требует действий владельца в Timeweb"
    owner: "Виталий Озолин"
    mitigation: "пошаговое сопровождение по одному действию"
  - id: lead_channel
    description: "публичный приёмник stroios.online недоступен: 502 Connection refused"
    owner: "Codex"
    mitigation: "восстановить сервис приёма, проверить CORS/origin и создать видимую тестовую запись в СтройкаОС"
  - id: provisional_prices
    description: "ориентиры комплектаций могут не совпасть с утверждённой экономикой"
    owner: "Виталий Озолин"
    mitigation: "показывать оговорку и заменить цены после подтверждения владельцем"
  - id: real_photo_assets
    description: "нет 8–12 профессиональных фото готовых домов, террасы и семейной жизни"
    owner: "Виталий Озолин"
    mitigation: "передать исходники или организовать съёмку; до этого маркировать все рендеры как визуализации"

decision_history:
  - date: "2026-07-29"
    decision: "взять логику ШЕСУА как референс, но сохранить характер ИКИОМА"
  - date: "2026-08-05"
    decision: "перенести сайт в Timeweb и использовать ikioma.ru"
  - date: "2026-08-05"
    decision: "GitHub становится главным источником, автодеплой обязателен"
  - date: "2026-08-05"
    decision: "Продукт временно назывался АРО 120: 96 м² дома и 24 м² террасы"
  - date: "2026-08-05"
    decision: "Все коммерческие CTA ведут в единую форму заявки СтройкаОС"
  - date: "2026-08-05"
    decision: "Цены 5,2 / 6,3 / 7,2 млн ₽ используются как предварительные ориентиры до подтверждения"
  - date: "2026-08-10"
    decision: "Владелец утвердил постоянное название модели КОНТУР"
  - date: "2026-08-10"
    decision: "На сайте используются фактические данные проекта: 86,2 м² внутри и 23,1 м² терраса"
  - date: "2026-08-10"
    decision: "Планировка и ППР Коробицино показаны как документы конкретного проекта, а не универсальное обещание"
  - date: "2026-08-10"
    decision: "Все не документальные изображения маркируются как визуализации до появления реальной фотогалереи"
  - date: "2026-08-10"
    decision: "До следующей итерации с реальными фотографиями опубликованы три временные AI-визуализации семейной жизни"
  - date: "2026-08-10"
    decision: "Интеграция со СтройкаОС не принята: тестовый запрос вернул 502, подтверждённой записи нет"

current_step:
  owner: "Codex и Виталий Озолин"
  action: "восстановить публичный приёмник stroios.online и повторить сквозную заявку с сайта"
  due: "до запуска внешнего трафика"
  expected_result: "форма возвращает успех, а тестовая заявка видна в воронке СтройкаОС с источником ikioma.ru"
  evidence: "HTTP 2xx, идентификатор записи и карточка тестовой заявки в СтройкаОС"
  next_transition: "заменить временные AI-визуализации 8–12 профессиональными фотографиями готовых объектов"

ai_process_contract:
  input_data:
    - "актуальный исходный код сайта"
    - "решения и замечания Виталия по UX/UI"
    - "статус GitHub, Timeweb, DNS и SSL"
  expected_result: "проверенная версия сайта автоматически опубликована на ikioma.ru"
  allowed_actions:
    - "изменять код сайта и конфигурацию сборки"
    - "создавать коммиты после проверки"
    - "проверять деплой, домен и ключевые клики"
  forbidden_actions:
    - "публиковать секреты и пароли"
    - "подменять реальную отправку заявки демонстрацией"
    - "менять DNS, тариф или платные ресурсы без подтверждения владельца"
    - "публиковать в ikioma.ru неподтверждённое имя продукта"
  responsible_human: "Виталий Озолин"
  estimated_cost_per_run: "зависит от тарифа ChatGPT; внешние платные действия запрещены без подтверждения"
  benefit_metric: "время от подтверждённого изменения до успешного деплоя"
  auto_disable_condition: "две подряд неуспешные публикации или риск потери доступности домена"
  opt_out:
    available: true
    method: "сообщить, что автоматическая публикация должна быть отключена"
    retained_without_ai: "сайт, домен, репозиторий и ручной деплой"
    data_no_longer_processed: "новые изменения кода и телеметрия проверок"
    prior_data_deletion: "по отдельному запросу владельца"
    impact: "обновления выполняются медленнее и требуют ручной проверки"
